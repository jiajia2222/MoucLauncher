name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts but do not publish a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs

      - name: Package (installer + portable + zip)
        run: npm run dist

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "标签 ${TAG} 与 package.json 版本 ${VERSION} 不一致：产物是按 package.json 命名的，先 bump 版本再打 tag" >&2
            exit 1
          fi
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
          {
            echo "## 下载说明"
            echo ""
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`MoucLauncher-${TAG#v}-Setup-x64.exe\` | 安装包：桌面快捷方式 + 开始菜单 |"
            echo "| \`MoucLauncher-${TAG#v}-portable-x64.exe\` | 免安装单文件，双击即用 |"
            echo "| \`MoucLauncher-${TAG#v}-windows-x64.zip\` | 快捷包：解压到任意目录，适合放 U 盘 / 多版本并存 |"
            echo ""
            echo "校验：\`Get-FileHash .\*.exe -Algorithm SHA256\` 对照 \`SHA256SUMS.txt\`。"
            echo ""
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' -n 40
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create and publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "$TAG" \
            --draft \
            --title "MoucLauncher ${VERSION}" \
            --notes-file release-notes.md
          gh release upload "$TAG" \
            "release/MoucLauncher-${VERSION}-Setup-x64.exe" \
            "release/MoucLauncher-${VERSION}-portable-x64.exe" \
            "release/MoucLauncher-${VERSION}-windows-x64.zip" \
            release/SHA256SUMS.txt \
            --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-x64-release
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
